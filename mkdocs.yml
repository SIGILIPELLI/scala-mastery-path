site_name: Scala Mastery Path
site_description: A structured, module-wise Scala training program from entry level to master level.
site_url: https://sigilipelli.github.io/scala-mastery-path/
repo_url: https://github.com/SIGILIPELLI/scala-mastery-path
repo_name: scala-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Setup & First Program": level-1/01-setup.md
      - "02 · Variables & Types": level-1/02-variables-types.md
      - "03 · Control Flow": level-1/03-control-flow.md
      - "04 · Functions": level-1/04-functions.md
      - "05 · Collections Basics": level-1/05-collections-basics.md
      - "06 · Classes & Objects Basics": level-1/06-classes-objects.md
      - "07 · Case Classes": level-1/07-case-classes.md
      - "08 · Pattern Matching Intro": level-1/08-pattern-matching-intro.md
      - "09 · Traits Basics": level-1/09-traits-basics.md
      - "10 · Project — CLI To-Do App": level-1/10-project-todo-app.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-2/*.md
  level-3/*.md
  level-4/*.md
